name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p best-peer

      # The validator is a gate from the first commit: a manifest the spec refuses fails the build.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: best-validate against the served manifest
        run: |
          ./target/release/best-peer &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7777/.well-known/best >/dev/null && break; sleep 1; done
          npx -y @behavioralstate/best-validate@0.4.2 http://127.0.0.1:7777
