name: release

# A release is a tag `v<version>` on a commit of `main`, made by `scripts/release.sh`. The tag must say what
# `Cargo.toml` says; the binaries must say it too. Three targets are built from the locked tree, archived with the
# README and the licence, summed, attested (SLSA build provenance) and published with notes made from the tag's
# message and the commits since the previous release. Run by hand (workflow_dispatch) it builds and keeps the archives
# as run artifacts without publishing anything: that is how a change to this file is tried.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag is honest before anything is built: on main, equal to the workspace version, and the tree is green.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: The version, from Cargo.toml; the tag must match it and sit on main
        id: version
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="best-peer"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::tag $tag does not match the workspace version $version; release with scripts/release.sh"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $tag is not on main"
              exit 1
            fi
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    env:
      NAME: best-peer-${{ needs.check.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: musl toolchain, for a Linux binary that runs on any distribution
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p best-peer --target ${{ matrix.target }}
      - name: The binary says the version the tag says
        shell: bash
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/best-peer
          [[ "${{ matrix.os }}" == windows-latest ]] && bin="$bin.exe"
          said=$("$bin" --version)
          [[ "$said" == "best-peer ${{ needs.check.outputs.version }}" ]] || { echo "::error::the binary says '$said'"; exit 1; }
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/$NAME"
          cp README.md LICENSE "dist/$NAME/"
          if [[ "${{ matrix.archive }}" == zip ]]; then
            cp target/${{ matrix.target }}/release/best-peer.exe "dist/$NAME/"
            (cd dist && 7z a -tzip "$NAME.zip" "$NAME" > /dev/null)
          else
            cp target/${{ matrix.target }}/release/best-peer "dist/$NAME/"
            tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum best-peer-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/best-peer-*
      - name: Release notes, from the tag's message and the commits since the previous release
        id: notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${{ needs.check.outputs.version }}"
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$tag^" 2>/dev/null || true)
          {
            echo "# best-peer $version"
            echo
            message=$(git for-each-ref "refs/tags/$tag" --format='%(contents)' | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
            if [[ -n "$message" ]]; then echo "$message"; echo; fi
            if [[ -n "$previous" ]]; then
              echo "## Commits since $previous"
              range="$previous..$tag"
            else
              echo "## Commits"
              range="$tag"
            fi
            echo
            git log --no-merges --format='- %s (%h)' "$range" | grep -v -E "^- Release $version \(" || true
            echo
            echo "## Run it"
            echo
            echo "One binary. Download the archive for the machine, check it against \`SHA256SUMS\`, unpack it and run \`best-peer\` with the environment the README's Run section names; \`best-peer --version\` says \`best-peer $version\`."
            echo
            echo "| Machine | Archive |"
            echo "|---|---|"
            echo "| Linux x86_64 (static, any distribution) | \`best-peer-$version-x86_64-unknown-linux-musl.tar.gz\` |"
            echo "| Windows x86_64 | \`best-peer-$version-x86_64-pc-windows-msvc.zip\` |"
            echo "| macOS Apple silicon | \`best-peer-$version-aarch64-apple-darwin.tar.gz\` |"
            echo
            echo "Every archive carries a build provenance attestation: \`gh attestation verify <archive> --repo ${GITHUB_REPOSITORY}\`."
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: best-peer ${{ needs.check.outputs.version }}
          body_path: notes.md
          files: |
            dist/best-peer-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.check.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.check.outputs.version, '-') }}
