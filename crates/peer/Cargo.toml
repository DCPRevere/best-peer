[package]
name = "best-peer"
description = "A BEST peer: one binary that puts a GPU host behind a Behavioral State Protocol door."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "best-peer"
path = "src/main.rs"

[dependencies]
axum = "0.7"
best-peer-door = { path = "../door" }
best-peer-gpu = { path = "../gpu" }
best-peer-runtime = { path = "../runtime" }
serde_json = { workspace = true }
time = { version = "0.3", features = ["formatting"] }
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"

[dev-dependencies]
http-body-util = "0.1"
serde_urlencoded = "0.7"
tower = { version = "0.5", features = ["util"] }
